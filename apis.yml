aid: google-wallet
name: Google Wallet
description: >-
  The Google Wallet API enables developers to create and manage digital passes including event tickets, boarding passes,
  loyalty cards, gift cards, offers, transit passes, and generic passes. It provides REST endpoints for creating pass
  classes (templates) and pass objects (instances), managing issuers, handling media uploads, and generating JWT tokens
  for save-to-wallet functionality on Android devices and the web.

    - path: /genericObject
      name: insertgenericobject
      operations:
      - method: POST
        name: insertgenericobject
        description: Google Wallet Insert Generic Object
        call: google-wallet.insertgenericobject
        outputParameters:
        - type: object
          mapping: $.
    - path: /genericObject/{resourceId}
      name: getgenericobject

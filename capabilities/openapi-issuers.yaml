naftiko: 1.0.0-alpha2
info:
  label: Google Wallet API — Issuers
  description: 'Google Wallet API — Issuers. 1 operations. Lead operation: Google Wallet List Issuers. Self-contained Naftiko
    capability covering one Google Wallet business surface.'
  tags:
  - Google Wallet
  - Issuers
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GOOGLE_WALLET_API_KEY: GOOGLE_WALLET_API_KEY
capability:
  consumes:
  - type: http
    namespace: openapi-issuers
    baseUri: https://walletobjects.googleapis.com/walletobjects/v1
    description: Google Wallet API — Issuers business capability. Self-contained, no shared references.
    resources:
    - name: issuer
      path: /issuer
      operations:
      - name: listissuers
        method: GET
        description: Google Wallet List Issuers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: openapi-issuers-rest
    port: 8080
    description: REST adapter for Google Wallet API — Issuers. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/issuer
      name: issuer
      description: REST surface for issuer.
      operations:
      - method: GET
        name: listissuers
        description: Google Wallet List Issuers
        call: openapi-issuers.listissuers
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: openapi-issuers-mcp
    port: 9090
    transport: http
    description: MCP adapter for Google Wallet API — Issuers. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: google-wallet-list-issuers
      description: Google Wallet List Issuers
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: openapi-issuers.listissuers
      outputParameters:
      - type: object
        mapping: $.
